name: Builder

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v)"
        required: true
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ["amd64", "aarch64"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve version" && exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION for ${{ matrix.arch }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image
        # Pin to a version that actually has a matching published
        # ghcr.io/home-assistant/{arch}-builder image. The action's own
        # GitHub release tag and its Docker image tag are not always
        # published together - 2026.06.0 exists as a release but the
        # image was never pushed ("manifest unknown" at build time,
        # found when Dependabot bumped to it in #29). Before bumping
        # this action, verify the image exists first, e.g.:
        # docker manifest inspect ghcr.io/home-assistant/amd64-builder:<version>
        #
        # --image must be "{owner}/{arch}-...", NOT "ghcr.io/{owner}/...":
        # the action always pushes to ghcr.io and prepends "ghcr.io/"
        # itself, so a value that already includes it gets published
        # twice ("ghcr.io/dibi73/ghcr.io/dibi73/..."), which Supervisor
        # then can't pull (v0.5.2, found via failed add-on install).
        uses: home-assistant/builder@2026.03.2
        with:
          args: |
            --${{ matrix.arch }} \
            --target bookstack-rag \
            --image "${{ github.repository_owner }}/{arch}-bookstack-rag-addon" \
            --version "${{ steps.version.outputs.version }}" \
            --docker-hub-check
