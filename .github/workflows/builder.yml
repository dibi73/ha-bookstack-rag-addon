name: Builder

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v)"
        required: true
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ["amd64", "aarch64"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve version" && exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION for ${{ matrix.arch }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image
        # Pin to a version that actually has a matching published
        # ghcr.io/home-assistant/{arch}-builder image. The action's own
        # GitHub release tag and its Docker image tag are not always
        # published together - 2026.06.0 exists as a release but the
        # image was never pushed ("manifest unknown" at build time,
        # found when Dependabot bumped to it in #29). Before bumping
        # this action, verify the image exists first, e.g.:
        # docker manifest inspect ghcr.io/home-assistant/amd64-builder:<version>
        #
        # --image must be JUST "{arch}-...", with NEITHER "ghcr.io/" NOR
        # the owner: the action always publishes to
        # "ghcr.io/{repository_owner}/<value of --image>" and prepends
        # that itself. v0.5.3 passed "${{ github.repository_owner }}/{arch}-..."
        # (dropping only the "ghcr.io/" part) and still ended up doubled,
        # this time on the owner segment
        # ("ghcr.io/dibi73/dibi73/{arch}-bookstack-rag-addon") - confirmed
        # from that build's own log ("Init cache for
        # ghcr.io/dibi73/dibi73/amd64-bookstack-rag-addon:0.5.3"). v0.5.2
        # had the same bug one level up (full "ghcr.io/dibi73/" doubled).
        # Supervisor pulls from the plain, single-prefixed path in
        # config.yaml's `image:` field - only that shape is correct.
        uses: home-assistant/builder@2026.03.2
        with:
          args: |
            --${{ matrix.arch }} \
            --target bookstack-rag \
            --image "{arch}-bookstack-rag-addon" \
            --version "${{ steps.version.outputs.version }}" \
            --docker-hub-check
